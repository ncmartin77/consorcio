version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: dbq
        out: internal/platform/dbq
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        json_tags_case_style: snake
        rename:
          administracione: Administracion
          sesione: Sesion
          auditorium: Auditoria
          unidade: Unidad
          grupos_prorrateo: GrupoProrrateo
          aplicacione: Aplicacion
          cargos_particulare: CargoParticular
          liquidacione: Liquidacion
          liquidacion_condonacione: LiquidacionCondonacion
          tasas_mora: TasaMora
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: numeric
            nullable: true
            go_type:
              import: github.com/shopspring/decimal
              type: Decimal
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              import: github.com/shopspring/decimal
              type: Decimal
              pointer: true
          - db_type: date
            go_type: github.com/ncmartin77/consorcio/plataforma/internal/platform/fecha.Fecha
          - db_type: date
            nullable: true
            go_type:
              import: github.com/ncmartin77/consorcio/plataforma/internal/platform/fecha
              type: Fecha
              pointer: true
