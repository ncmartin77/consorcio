# Backup diario de la base de Supabase (esquema public), cifrado con age.
#
# El repo es publico: el dump NUNCA se sube sin cifrar. Solo sale del runner
# el archivo .age, que se descifra con la clave privada de alguno de los
# destinatarios de AGE_RECIPIENTS.
#
# Secretos del repo (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL  URI del "Session pooler" de Supabase (IPv4, puerto 5432):
#                    postgresql://postgres.<project>:<clave>@aws-X-ca-central-1.pooler.supabase.com:5432/postgres
#   AGE_RECIPIENTS   una o mas claves publicas age (age1...), separadas por espacios
#
# Restaurar en local: scripts/restaurar_local.sh <archivo.dump.age>

name: Backup base de datos

on:
  schedule:
    - cron: "17 6 * * *"   # 03:17 hora argentina
  workflow_dispatch:
  push:
    branches: [feat/entorno-local]
    paths: [.github/workflows/backup-db.yml]

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      AGE_RECIPIENTS: ${{ secrets.AGE_RECIPIENTS }}
    steps:
      - name: Verificar secretos
        run: |
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Falta el secreto SUPABASE_DB_URL"; exit 1; }
          [ -n "$AGE_RECIPIENTS" ] || { echo "::error::Falta el secreto AGE_RECIPIENTS"; exit 1; }

      - name: Instalar age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      # pg_dump tiene que ser de la misma version mayor que el servidor (o mayor):
      # se consulta la version y se usa la imagen oficial de postgres que corresponde.
      - name: Version del servidor
        id: ver
        run: |
          major=$(docker run --rm -e SUPABASE_DB_URL postgres:17-alpine \
                    sh -c 'psql "$SUPABASE_DB_URL" -Atc "SHOW server_version_num"' | cut -c1-2)
          echo "Postgres $major"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: pg_dump y cifrado
        id: dump
        run: |
          nombre="consorcio_$(date -u +%Y%m%d_%H%M)"
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          docker run --rm -e SUPABASE_DB_URL -v "$out:/out" postgres:${{ steps.ver.outputs.major }}-alpine \
            sh -c 'pg_dump "$SUPABASE_DB_URL" --format=custom --schema=public --no-owner --no-privileges -f /out/db.dump'

          rcpt=""
          for r in $AGE_RECIPIENTS; do rcpt="$rcpt -r $r"; done
          age $rcpt -o "$out/$nombre.dump.age" "$out/db.dump"
          shred -u "$out/db.dump" 2>/dev/null || rm -f "$out/db.dump"

          ls -l "$out"
          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"
          echo "archivo=$out/$nombre.dump.age" >> "$GITHUB_OUTPUT"

      - name: Resumen
        run: |
          echo "### Backup $(date -u +'%Y-%m-%d %H:%M') UTC" >> "$GITHUB_STEP_SUMMARY"
          echo "Archivo: \`${{ steps.dump.outputs.nombre }}.dump.age\` ($(du -h '${{ steps.dump.outputs.archivo }}' | cut -f1), cifrado con age)" >> "$GITHUB_STEP_SUMMARY"

      - name: Subir backup cifrado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.nombre }}
          path: ${{ steps.dump.outputs.archivo }}
          retention-days: 30
          if-no-files-found: error
