<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recibo {{ periodo | mes_largo }} — Unidad {{ unidad }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .pdf-frame { width: 100%; height: 80vh; border: none; border-radius: 0 0 .375rem .375rem; }
    @media (max-width: 576px) { .pdf-frame { height: 60vh; } }
  </style>
</head>
<body>
  <div class="container py-4" style="max-width:860px">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
          <div>
            <h5 class="mb-0 fw-bold">
              <i class="bi bi-receipt"></i> Recibo de Pago
            </h5>
            <small class="opacity-75">{{ edificio }} &mdash; Unidad <strong>{{ unidad }}</strong> &mdash; {{ periodo | mes_largo }}</small>
          </div>
          <div class="d-flex gap-2 flex-wrap">
            <a href="{{ pdf_url }}" download="recibo_{{ periodo }}_{{ unidad }}.pdf"
               class="btn btn-light btn-sm">
              <i class="bi bi-download"></i> Descargar PDF
            </a>
            <button onclick="window.open('{{ pdf_url }}', '_blank')"
                    class="btn btn-outline-light btn-sm">
              <i class="bi bi-printer"></i> Imprimir
            </button>
          </div>
        </div>
      </div>
      <div class="card-body p-0">
        <iframe class="pdf-frame" src="{{ pdf_url }}"
                title="Recibo {{ periodo }} unidad {{ unidad }}">
          <p class="p-3 text-muted">
            Tu navegador no puede mostrar el PDF.
            <a href="{{ pdf_url }}">Descargalo desde acá</a>.
          </p>
        </iframe>
      </div>
      <div class="card-footer text-muted small text-center">
        <i class="bi bi-shield-check text-success"></i>
        Recibo verificado &mdash;
        <a href="{{ url_verificacion }}" target="_blank" class="text-decoration-none">
          Verificar autenticidad
        </a>
      </div>
    </div>
  </div>
</body>
</html>
