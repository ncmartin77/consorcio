<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Consorcio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Consorcio">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <style>
    body { background: #f0f4f8; }
    .login-card { max-width: 400px; margin: 10vh auto; }
    .btn-google {
      background: #fff; border: 1px solid #dadce0; color: #3c4043;
      font-weight: 500; display: flex; align-items: center; gap: 12px;
      justify-content: center; padding: 10px 24px; font-size: 1rem;
      transition: box-shadow .2s;
    }
    .btn-google:hover { box-shadow: 0 2px 8px rgba(0,0,0,.15); background: #f8f9fa; }
    .google-logo { width: 20px; height: 20px; }
  </style>
</head>
<body>
<div class="login-card card shadow-sm p-4 p-md-5">
  <div class="text-center mb-4">
    <i class="bi bi-building text-primary" style="font-size:3rem"></i>
    <h4 class="mt-2 fw-bold">Administración de Consorcios</h4>
    <p class="text-muted small">Ingresá con tu cuenta de Google para continuar</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <a href="{{ url_for('login_google') }}" class="btn btn-google w-100">
    <svg class="google-logo" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Continuar con Google
  </a>
</div>
</body>
</html>
